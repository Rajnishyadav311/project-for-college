{% extends 'base.html' %}

{% block title %}Sign In — MediPredict AI{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card card-medi p-4 p-md-5 shadow-lg">
                <div class="text-center mb-4">
                    <div class="icon-badge badge-cyan mx-auto mb-3" style="width: 56px; height: 56px; font-size: 1.5rem;">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Welcome Back</h3>
                    <p class="text-muted small">Sign in to access your MediPredict AI portal</p>
                </div>

                <form method="post" action="{% url 'core:login' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa-solid fa-user text-muted"></i></span>
                            {{ form.username }}
                        </div>
                    </div>

                    <div class="mb-4">
                        <div class="d-flex justify-content-between">
                            <label class="form-label">Password</label>
                        </div>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="fa-solid fa-key text-muted"></i></span>
                            {{ form.password }}
                        </div>
                    </div>

                    <button type="submit" class="btn btn-cyan w-100 py-2 mb-3">
                        <i class="fa-solid fa-arrow-right-to-bracket me-2"></i> Sign In
                    </button>
                </form>

                <div class="text-center border-top pt-3 mt-2">
                    <span class="small text-muted">Don't have an account yet?</span>
                    <div class="mt-2 d-flex justify-content-center gap-2">
                        <a href="{% url 'core:register_patient' %}" class="btn btn-sm btn-outline-cyan">Register as Patient</a>
                        <a href="{% url 'core:register_doctor' %}" class="btn btn-sm btn-outline-secondary">Doctor Sign Up</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
